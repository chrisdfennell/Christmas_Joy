    <rect x="16" y="21" width="8" height="6" fill="#F6E6E0"/>
    <path d="M14.5 21.5 L20 16.5 L25.5 21.5 Z" fill="#FFFFFF"/>
    <rect x="17.5" y="22.5" width="2" height="2" fill="#D9E6EE"/>
